<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — EJEP Camp 2026</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #3B5FA0; --primary-dark: #2A4580; --primary-deeper: #1E3366;
  --accent: #F5C842; --accent-dark: #D4A820;
  --white: #FAFAF5; --white-dim: rgba(250,250,245,0.65);
  --success: #4CAF82; --error: #E85D4A;
  --surface: rgba(255,255,255,0.06); --border: rgba(250,250,245,0.12);
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--primary-deeper); color: var(--white); min-height: 100vh; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); background-size: 200px 200px; }
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.login-box { background: var(--surface); border: 1px solid rgba(245,200,66,0.25); border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center; }
.login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--accent); }
.login-sub { font-size: 0.8rem; color: var(--white-dim); margin: 0.3rem 0 1.8rem; }
.login-box input { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(250,250,245,0.2); border-radius: 10px; color: var(--white); font-family: 'Noto Sans KR', sans-serif; font-size: 1rem; padding: 0.85rem 1rem; outline: none; text-align: center; letter-spacing: 3px; margin-bottom: 1rem; transition: border-color 0.2s; }
.login-box input:focus { border-color: var(--accent); }
.btn-primary { width: 100%; padding: 0.85rem; background: var(--accent); color: #1E3366; border: none; border-radius: 10px; font-family: 'Noto Sans KR', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: var(--accent-dark); }
.login-err { font-size: 0.82rem; color: #FFB3A7; margin-top: 0.75rem; display: none; }
#admin-screen { display: none; position: relative; z-index: 1; }
.top-nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: rgba(20,38,85,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(245,200,66,0.2); }
.nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 3px; color: var(--accent); }
.nav-right { display: flex; gap: 0.75rem; align-items: center; }
.btn-sm { padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: 1px solid; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; }
.btn-export { background: transparent; border-color: rgba(245,200,66,0.4); color: var(--accent); }
.btn-export:hover { background: rgba(245,200,66,0.1); }
.btn-logout { background: transparent; border-color: rgba(250,250,245,0.2); color: var(--white-dim); }
.btn-logout:hover { border-color: rgba(250,250,245,0.4); color: var(--white); }
.main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1.5rem; }
.stat-card-num { font-size: 2.2rem; font-weight: 900; line-height: 1; }
.stat-card-label { font-size: 0.75rem; color: var(--white-dim); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 0.3rem; }
.stat-card.total .stat-card-num { color: var(--accent); }
.stat-card.attended .stat-card-num { color: #7DE8B4; }
.stat-card.absent .stat-card-num { color: #FFB3A7; }
.progress-bar-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1.5rem; margin-bottom: 2rem; }
.progress-label { display: flex; justify-content: space-between; margin-bottom: 0.6rem; }
.progress-label span { font-size: 0.8rem; color: var(--white-dim); }
.progress-label strong { font-size: 0.8rem; color: var(--accent); }
.progress-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #4CAF82, #7DE8B4); border-radius: 4px; transition: width 0.6s ease; }
.toolbar { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 200px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-family: 'Noto Sans KR', sans-serif; font-size: 0.9rem; padding: 0.55rem 1rem; outline: none; transition: border-color 0.2s; }
.search-input:focus { border-color: rgba(245,200,66,0.5); }
.search-input::placeholder { color: rgba(250,250,245,0.3); }
.filter-btn { padding: 0.55rem 1rem; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--white-dim); font-family: 'Noto Sans KR', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
.filter-btn.active { background: rgba(245,200,66,0.15); border-color: rgba(245,200,66,0.4); color: var(--accent); }
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th { padding: 0.75rem 1rem; text-align: left; font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--white-dim); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.15); white-space: nowrap; }
tbody tr { border-bottom: 1px solid rgba(250,250,245,0.05); transition: background 0.15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.04); }
tbody td { padding: 0.7rem 1rem; font-size: 0.88rem; vertical-align: middle; }
.tag-family { display: inline-block; background: rgba(245,200,66,0.1); border: 1px solid rgba(245,200,66,0.25); border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.7rem; color: var(--accent); margin-left: 0.3rem; vertical-align: middle; }
.status-badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.65rem; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
.status-badge.done { background: rgba(76,175,130,0.15); color: #7DE8B4; }
.status-badge.pending { background: rgba(250,250,245,0.08); color: var(--white-dim); }
.btn-toggle { padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; border: 1px solid; font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s; white-space: nowrap; }
.btn-toggle.check-in { background: rgba(76,175,130,0.1); border-color: rgba(76,175,130,0.3); color: #7DE8B4; }
.btn-toggle.check-in:hover { background: rgba(76,175,130,0.25); }
.btn-toggle.check-out { background: rgba(232,93,74,0.1); border-color: rgba(232,93,74,0.3); color: #FFB3A7; }
.btn-toggle.check-out:hover { background: rgba(232,93,74,0.25); }
.note-tag { font-size: 0.75rem; color: #FFB3A7; }
.empty-msg { text-align: center; padding: 3rem; color: var(--white-dim); font-size: 0.9rem; }
.loading-msg { text-align: center; padding: 3rem; color: var(--white-dim); font-size: 0.9rem; }
@media (max-width: 640px) {
  .stats-grid { gap: 0.5rem; }
  .main { padding: 1rem; }
  .top-nav { padding: 0.75rem 1rem; }
  thead th:nth-child(4), thead th:nth-child(5), thead th:nth-child(7) { display: none; }
  tbody td:nth-child(4), tbody td:nth-child(5), tbody td:nth-child(7) { display: none; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">EJEP 2026</div>
    <div class="login-sub">관리자 페이지</div>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-primary" onclick="login()">로그인</button>
    <div class="login-err" id="login-err">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div id="admin-screen">
  <nav class="top-nav">
    <div class="nav-logo">EJEP 2026 · 관리자</div>
    <div class="nav-right">
      <button class="btn-sm btn-export" onclick="exportCSV()">CSV 내보내기</button>
      <button class="btn-sm btn-logout" onclick="logout()">로그아웃</button>
    </div>
  </nav>
  <div class="main">
    <div class="stats-grid">
      <div class="stat-card total"><div class="stat-card-num" id="a-total">—</div><div class="stat-card-label">총원</div></div>
      <div class="stat-card attended"><div class="stat-card-num" id="a-attended">—</div><div class="stat-card-label">참석</div></div>
      <div class="stat-card absent"><div class="stat-card-num" id="a-absent">—</div><div class="stat-card-label">결원</div></div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-label"><span>참석률</span><strong id="a-pct">0%</strong></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="toolbar">
      <input type="text" class="search-input" id="search-input" placeholder="이름 / 방 / 팀 검색..." oninput="renderTable()">
      <button class="filter-btn active" id="f-all" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" id="f-attended" onclick="setFilter('attended')">참석</button>
      <button class="filter-btn" id="f-absent" onclick="setFilter('absent')">미참석</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>이름</th><th>팀</th><th>방</th><th>성별</th><th>나이</th><th>상태</th><th>체크인 시각</th><th>조정</th>
          </tr>
        </thead>
        <tbody id="member-table">
          <tr><td colspan="8" class="loading-msg">로딩 중...</td></tr>
        </tbody>
      </table>
      <div class="empty-msg" id="empty-msg" style="display:none">검색 결과가 없습니다.</div>
    </div>
  </div>
</div>

<script>
const API = typeof API_URL !== 'undefined' ? API_URL : '';
let adminPw = '';
let allMembers = [];
let currentFilter = 'all';

async function apiCall(action, body = null) {
  const url = API + '?action=' + action + (adminPw ? '&password=' + encodeURIComponent(adminPw) : '');
  const opts = body ? { method: 'POST', body: JSON.stringify(body) } : { method: 'GET' };
  const r = await fetch(url, opts);
  return r.json();
}

async function login() {
  const pw = document.getElementById('pw-input').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  try {
    adminPw = pw;
    const d = await apiCall('getMembers');
    if (d.error) { errEl.style.display = 'block'; adminPw = ''; return; }
    allMembers = d.members;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    renderAll();
    setInterval(loadMembers, 30000);
  } catch(e) {
    errEl.textContent = '서버 연결 실패'; errEl.style.display = 'block'; adminPw = '';
  }
}

function logout() {
  adminPw = ''; allMembers = [];
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('pw-input').value = '';
}

async function loadMembers() {
  try {
    const d = await apiCall('getMembers');
    if (d.members) { allMembers = d.members; renderAll(); }
  } catch(e) {}
}

function renderAll() { renderStats(); renderTable(); }

function renderStats() {
  const total = allMembers.length;
  const attended = allMembers.filter(m => m.checkedIn).length;
  const absent = total - attended;
  const pct = total ? Math.round(attended / total * 100) : 0;
  document.getElementById('a-total').textContent = total;
  document.getElementById('a-attended').textContent = attended;
  document.getElementById('a-absent').textContent = absent;
  document.getElementById('a-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function setFilter(f) {
  currentFilter = f;
  ['all','attended','absent'].forEach(id => document.getElementById('f-' + id).classList.toggle('active', id === f));
  renderTable();
}

function renderTable() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  let members = [...allMembers];
  if (currentFilter === 'attended') members = members.filter(m => m.checkedIn);
  if (currentFilter === 'absent') members = members.filter(m => !m.checkedIn);
  if (q) members = members.filter(m => m.name.includes(q) || (m.room||'').toLowerCase().includes(q) || (m.team||'').toLowerCase().includes(q));

  members.sort((a, b) => {
    const ga = a.familyGroup || 'ZZZ_' + a.name;
    const gb = b.familyGroup || 'ZZZ_' + b.name;
    return ga.localeCompare(gb);
  });

  const tbody = document.getElementById('member-table');
  const empty = document.getElementById('empty-msg');
  if (members.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  let lastGroup = null;
  tbody.innerHTML = members.map(m => {
    const isNewGroup = m.familyGroup && m.familyGroup !== lastGroup;
    if (m.familyGroup) lastGroup = m.familyGroup;
    const checkinTime = m.checkedInAt ? new Date(m.checkedInAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '—';
    return `<tr style="${isNewGroup ? 'background:rgba(245,200,66,0.03)' : ''}">
      <td>${m.name}${m.familyGroup ? `<span class="tag-family">${m.familyGroup}</span>` : ''}${m.note ? `<div class="note-tag">⚠ ${m.note}</div>` : ''}</td>
      <td>${m.team || '—'}</td>
      <td>${m.room || '—'}</td>
      <td>${m.gender || '—'}</td>
      <td>${m.age ? m.age + '세' : '—'}</td>
      <td><span class="status-badge ${m.checkedIn ? 'done' : 'pending'}">${m.checkedIn ? '✓ 참석' : '미도착'}</span></td>
      <td style="font-size:0.8rem;color:var(--white-dim)">${checkinTime}</td>
      <td><button class="btn-toggle ${m.checkedIn ? 'check-out' : 'check-in'}" onclick="toggleCheckin(${m.id}, ${!m.checkedIn})">${m.checkedIn ? '취소' : '체크인'}</button></td>
    </tr>`;
  }).join('');
}

async function toggleCheckin(id, checkedIn) {
  try {
    const d = await apiCall('toggleCheckin', { id, checkedIn, password: adminPw });
    if (d.error) { alert(d.error); return; }
    const idx = allMembers.findIndex(m => m.id === id);
    if (idx !== -1) allMembers[idx] = d.member;
    renderAll();
  } catch(e) { alert('오류가 발생했습니다.'); }
}

async function exportCSV() {
  try {
    const d = await apiCall('export');
    if (d.error) { alert(d.error); return; }
    const rows = [d.headers, ...d.rows];
    const csv = rows.map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'checkin_' + Date.now() + '.csv';
    link.click();
  } catch(e) { alert('내보내기 실패'); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') login();
});
</script>
</body>
</html>
